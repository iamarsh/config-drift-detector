service: config-drift-detector

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 256  # Reduced from 512MB to optimize cost (50% savings)
  timeout: 120     # Reduced from 300s to 120s (still plenty for most operations)
  logRetentionInDays: 30  # AWS Free Tier: 5GB/month log storage

  environment:
    AWS_ACCOUNT_ID: ${env:AWS_ACCOUNT_ID}
    S3_BUCKET_NAME: ${env:S3_BUCKET_NAME}
    SUPABASE_URL: ${env:SUPABASE_URL}
    SUPABASE_SERVICE_ROLE_KEY: ${env:SUPABASE_SERVICE_ROLE_KEY}
    SLACK_WEBHOOK_URL: ${env:SLACK_WEBHOOK_URL}
    NODE_ENV: ${env:NODE_ENV, 'production'}
    LOG_LEVEL: ${env:LOG_LEVEL, 'info'}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ec2:DescribeInstances
            - ec2:DescribeSecurityGroups
            - rds:DescribeDBInstances
            - s3:ListBucket
            - s3:GetObject
            - s3:PutObject
          Resource: '*'
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - !GetAtt DriftEventsDLQ.Arn

functions:
  snapshot:
    handler: dist/lambdas/snapshot.handler
    description: Take periodic snapshots of AWS resources
    memorySize: 256
    timeout: 60
    events:
      - schedule:
          name: ${self:service}-${self:provider.stage}-snapshot-schedule
          description: Trigger snapshot every hour
          rate: cron(0 * * * ? *)  # Every hour at :00 (was every 30 min)
          enabled: true

  detect:
    handler: dist/lambdas/detect.handler
    description: Detect configuration drift by comparing snapshots
    memorySize: 512  # Needs more memory for diff computation
    timeout: 90
    events:
      - schedule:
          name: ${self:service}-${self:provider.stage}-detect-schedule
          description: Trigger drift detection 5 minutes after snapshot
          rate: cron(5 * * * ? *)  # Every hour at :05 (was every 30 min)
          enabled: true

  alert:
    handler: dist/lambdas/alert.handler
    description: Send Slack alerts for HIGH/CRITICAL drift
    memorySize: 128  # Minimal memory needed for simple query + HTTP call
    timeout: 30
    events:
      - schedule:
          name: ${self:service}-${self:provider.stage}-alert-schedule
          description: Trigger alerts 10 minutes after snapshot
          rate: cron(10 * * * ? *)  # Every hour at :10 (was every 30 min)
          enabled: true

plugins:
  - serverless-esbuild

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    format: cjs
    outputFileExtension: .js
    exclude:
      - '@aws-sdk/*'
    target: node20
    platform: node
    concurrency: 10

resources:
  Resources:
    # SNS Topic for CloudWatch Alarms
    AlertTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${self:provider.stage}-alerts
        DisplayName: Config Drift Detector Alerts
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: Purpose
            Value: CloudWatch alarm notifications

    # Dead-Letter Queue for failed drift insertions
    DriftEventsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-drift-events-dlq
        MessageRetentionPeriod: 1209600  # 14 days (max retention)
        VisibilityTimeout: 300
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: Purpose
            Value: Dead-letter queue for failed drift event insertions

    # CloudWatch Alarm: Lambda Errors
    LambdaErrorAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-lambda-errors
        AlarmDescription: Alert when Lambda functions have 5+ errors in 5 minutes
        MetricName: Errors
        Namespace: AWS/Lambda
        Statistic: Sum
        Period: 300  # 5 minutes
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        ActionsEnabled: true
        AlarmActions:
          - !Ref AlertTopic
        Dimensions:
          - Name: FunctionName
            Value: !Ref SnapshotLambdaFunction

    # CloudWatch Alarm: DLQ Depth
    DLQDepthAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-dlq-depth
        AlarmDescription: Alert when DLQ has 10+ messages (failed drift insertions)
        MetricName: ApproximateNumberOfMessagesVisible
        Namespace: AWS/SQS
        Statistic: Average
        Period: 300  # 5 minutes
        EvaluationPeriods: 1
        Threshold: 10
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        ActionsEnabled: true
        AlarmActions:
          - !Ref AlertTopic
        Dimensions:
          - Name: QueueName
            Value: !GetAtt DriftEventsDLQ.QueueName

  Outputs:
    AlertTopicArn:
      Description: ARN of the SNS Alert Topic
      Value: !Ref AlertTopic
      Export:
        Name: ${self:service}-${self:provider.stage}-alert-topic-arn

    DriftEventsDLQUrl:
      Description: URL of the Drift Events Dead-Letter Queue
      Value: !Ref DriftEventsDLQ
      Export:
        Name: ${self:service}-${self:provider.stage}-dlq-url

    DriftEventsDLQArn:
      Description: ARN of the Drift Events Dead-Letter Queue
      Value: !GetAtt DriftEventsDLQ.Arn
      Export:
        Name: ${self:service}-${self:provider.stage}-dlq-arn

package:
  individually: true
  patterns:
    - '!node_modules/**'
    - '!tests/**'
    - '!src/**'
    - '!.env*'
    - '!*.md'
